<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="412" viewBox="0 0 1152 412" fill="none" role="img" aria-label="zeus">
  <defs>
    <linearGradient id="rim" x1="140" y1="0" x2="1012" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2b01e" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#f2b01e" stop-opacity="0.9"/>
      <stop offset="0.65" stop-color="#fde9b0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8fb6f9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="card">
      <rect x="16" y="16" width="1120" height="380" rx="56"/>
    </clipPath>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5c350"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="1120" height="380" rx="56" fill="#08090B"/>
  <g clip-path="url(#card)">
    <rect x="140" y="14" width="872" height="4" fill="url(#rim)" filter="url(#glow)"/>
    <rect x="140" y="15" width="872" height="2" fill="url(#rim)"/>
  </g>
  <rect x="16.75" y="16.75" width="1118.5" height="378.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- The mark: the bolt of the favicon, on the gold of the page's accent. -->
  <g transform="translate(84 146)">
    <rect width="120" height="120" rx="30" fill="#f2b01e"/>
    <path transform="translate(1 0) scale(3.75)" d="M18.4 4.5 8.6 17.7h6.1l-1.4 9.8 9.9-13.4h-6.2z" fill="#15171c"/>
  </g>

  <text x="240" y="214" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-2.5" fill="#F3F4F6">ze<tspan fill="#f5c350">us</tspan></text>
  <text x="244" y="262" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#9ca3af">Follow and steer a fleet of git repositories</text>

  <line x1="836" y1="96" x2="836" y2="316" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- A parent folder, two accounts, their repositories: up to date, behind, not cloned yet. -->
  <g>
    <rect x="866" y="72" width="236" height="74" rx="14" fill="#ffffff" fill-opacity="0.035"/>
    <rect x="866" y="168" width="236" height="74" rx="14" fill="#ffffff" fill-opacity="0.035"/>
    <rect x="866" y="264" width="236" height="74" rx="14" fill="#ffffff" fill-opacity="0.035"/>

    <g stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#grey)" stroke-opacity="0.8">
      <path d="M984 120 C984 158 924 158 924 192"/>
      <path d="M984 120 C984 158 1044 158 1044 192"/>
      <path d="M924 214 C924 252 898 252 898 288"/>
      <path d="M924 214 C924 252 952 252 952 288"/>
      <path d="M1044 214 C1044 252 1070 252 1070 288"/>
    </g>
    <path d="M1044 214 C1044 252 1016 252 1016 288" stroke="#f5c350" stroke-width="2.5" fill="none" marker-end="url(#gold)"/>
    <path d="M924 214 C924 250 1004 258 1006 288" stroke="#6b7280" stroke-opacity="0" fill="none"/>

    <!-- the parent folder -->
    <rect x="944" y="98" width="80" height="22" rx="7" fill="#16191e" stroke="#f2b01e" stroke-width="1.75"/>
    <path transform="translate(977 101) scale(0.5)" d="M18.4 4.5 8.6 17.7h6.1l-1.4 9.8 9.9-13.4h-6.2z" fill="#f2b01e"/>

    <!-- the accounts -->
    <g fill="#16191e" stroke="#2b313b" stroke-width="1.5">
      <rect x="892" y="192" width="64" height="22" rx="7"/>
      <rect x="1012" y="192" width="64" height="22" rx="7"/>
    </g>

    <!-- the repositories -->
    <g fill="#16191e" stroke="#2b313b" stroke-width="1.5">
      <rect x="876" y="288" width="44" height="22" rx="7"/>
      <rect x="930" y="288" width="44" height="22" rx="7"/>
    </g>
    <rect x="994" y="288" width="44" height="22" rx="7" fill="#16191e" stroke="#f5c350" stroke-width="1.75"/>
    <rect x="1048" y="288" width="44" height="22" rx="7" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="888" cy="299" r="3.5" fill="#62d199"/>
    <circle cx="942" cy="299" r="3.5" fill="#62d199"/>
    <circle cx="1006" cy="299" r="3.5" fill="#f5c350"/>
  </g>
</svg>
